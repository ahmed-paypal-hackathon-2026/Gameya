services:
  - type: web
    name: gameya-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # The Dockerfile copies backend/ and shared/fixtures, so build from the repo root.
    dockerContext: .
    # Free tier only (no paid plans). paypal-agent-toolkit is dev-only, so the image
    # fits in 512 MB. Free services sleep when idle: the first request takes ~1 min.
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DEMO_MODE
        value: "1"
      # Signs demo-login tokens; Render generates it, it is never in the repo.
      - key: SESSION_SECRET
        generateValue: true
      # Needed in X-Admin-Token for reset-demo / fast-forward on the hosted demo.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PAYPAL_API_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gameya-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://gameya-web.onrender.com

  - type: web
    name: gameya-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gameya-api.onrender.com
      - key: VITE_USE_MOCKS
        value: "0"

databases:
  - name: gameya-db
    databaseName: gameya
    # Free Postgres expires 30 days after creation; reset-demo reseeds a new one.
    plan: free
